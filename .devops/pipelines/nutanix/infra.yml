parameters:
- name: citrix_cloud
  type: boolean
  default: false
- name: citrix_vad
  type: boolean
  default: false
- name: vmware_horizon
  type: boolean
  default: false
- name: loadgen_bots
  type: boolean
  default: false

trigger: none
pr: none

pool: GO Pipelines

variables:
- group: Lab

stages:
- stage: unseal
  jobs:
  - job: vault
    steps:
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          $env:VAULT_ADDR="$(vault_addr)"
          $env:VAULT_TOKEN="$(vault_token)"
          if ((vault status -format=json | ConvertFrom-Json).sealed) {
            vault operator unseal $(vault_unseal_1)
            vault operator unseal $(vault_unseal_2)
            vault operator unseal $(vault_unseal_3)
          }

- stage: infra
  dependsOn: unseal
  jobs:
  - job: provision
    steps:
    # No manifest artifact is needed: Terraform resolves the golden image by
    # name directly from the Prism Central image library.
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          $env:VAULT_ADDR="$(vault_addr)"
          $env:VAULT_TOKEN="$(vault_token)"
          $range = .devops/pipelines/scripts/network-plan.ps1 -Platform nutanix
          @(
            "network_list = $($range | ConvertTo-Json -Compress)",
            "citrix_cloud = ${{ lower(parameters.citrix_cloud) }}",
            "citrix_vad = ${{ lower(parameters.citrix_vad) }}",
            "vmware_horizon = ${{ lower(parameters.vmware_horizon) }}",
            "bot_count = ${{ iif(parameters.loadgen_bots, 2, 0) }}"
          ) | Set-Content terraform/nutanix/infra/terraform.tfvars
    - task: CmdLine@2
      inputs:
        workingDirectory: terraform/nutanix/infra
        script: terraform init -backend-config="conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)"
    - task: CmdLine@2
      inputs:
        workingDirectory: terraform/nutanix/infra
        script: terraform apply -auto-approve -var="vault_address=$(vault_addr)" -var="vault_token=$(vault_token)"

# Monitoring stack (InfluxDB + Grafana) on the control-plane VM. Runs before
# the domain stage so the telegraf agents installed on the workload VMs can
# read the Influx URL and token from Vault (go/influx) right away.
- stage: docker
  dependsOn: unseal
  jobs:
  - job: monitoring
    displayName: Deploy monitoring containers
    steps:
    - task: CmdLine@2
      displayName: Setup required packages
      inputs:
        script: |
          pip3 install hvac
          chmod +x .devops/pipelines/scripts/install-galaxy-collections.sh
          .devops/pipelines/scripts/install-galaxy-collections.sh community.docker community.hashi_vault
    - task: PowerShell@2
      displayName: Deploy InfluxDB and Grafana
      inputs:
        targetType: inline
        script: |
          $env:VAULT_FORMAT="json"
          $env:VAULT_ADDR="$(vault_addr)"
          $env:VAULT_TOKEN="$(vault_token)"

          # The Nutanix initializer stores the control-plane address as a full
          # IP under go/docker (unlike the VMware offset-based layout).
          $docker = vault kv get -format json -mount=go docker | ConvertFrom-Json

          @(
            "[docker]",
            "$($docker.data.name) ansible_host=$($docker.data.ip)"
          ) | Set-Content -Path ansible/inventory -Force

          $env:ANSIBLE_HOST_KEY_CHECKING=$false
          ansible-playbook ansible/monitoring.yml -i ansible/inventory -e ansible_user=$($docker.data.user) -e ansible_password=`'$($docker.data.password)`' -e vault_addr=$(vault_addr) -e vault_token=$(vault_token)

- stage: domain
  dependsOn:
  - infra
  - docker
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: domain.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: management
  dependsOn: domain
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: management.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: sql
  dependsOn: domain
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: mssql.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: rdgateway
  dependsOn: domain
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: rdgateway.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: loadgen
  displayName: LoadGen Bots
  dependsOn: domain
  condition: eq('${{ parameters.loadgen_bots }}', true)
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: loadgen.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

# Citrix and Horizon playbooks no-op when the matching Terraform parameter
# is off (empty inventory). DDC waits for SQL to finish so the site can use
# the database when it is there, but still runs if SQL failed — otherwise a
# SQL error skips every Citrix stage. License and StoreFront only need the
# domain; StoreFront also waits for DDC to finish (success or fail).
- stage: citrix_ddc
  displayName: Citrix Delivery Controller
  dependsOn:
  - domain
  - sql
  condition: succeeded('domain')
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: citrix-delivery-controller.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: citrix_lic
  displayName: Citrix License Server
  dependsOn: domain
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: citrix-license-server.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: citrix_sf
  displayName: Citrix StoreFront
  dependsOn:
  - domain
  - citrix_ddc
  condition: succeeded('domain')
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: citrix-storefront.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: horizon
  displayName: VMware Horizon Connection Server
  dependsOn: domain
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: horizon-connection-server.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra

- stage: updates
  displayName: Windows Updates
  dependsOn:
  - management
  - sql
  - rdgateway
  - loadgen
  - citrix_ddc
  - citrix_lic
  - citrix_sf
  - horizon
  # Wait for every workload stage to finish. Skipped (e.g. LoadGen off) and
  # failed stages must not cancel Updates — those VMs may already be joined
  # and still need patching. Canceled dependencies keep this stage from running.
  condition: |
    and(
      in(dependencies.management.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped'),
      in(dependencies.sql.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped'),
      in(dependencies.rdgateway.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped'),
      in(dependencies.loadgen.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped'),
      in(dependencies.citrix_ddc.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped'),
      in(dependencies.citrix_lic.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped'),
      in(dependencies.citrix_sf.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped'),
      in(dependencies.horizon.result, 'Succeeded', 'SucceededWithIssues', 'Failed', 'Skipped')
    )
  jobs:
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: updates.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra
