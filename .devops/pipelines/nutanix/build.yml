parameters:
- name: redeploy
  displayName: Redeploy Build Machine
  type: boolean
  default: false

- name: delivery
  type: string
  default: Citrix
  values: [Citrix, VMware, RDSH]

trigger: none
pr: none

pool: GO Pipelines

variables:
- group: Lab

stages:
# Optionally re-clone the build VM from the golden image first, so the
# delivery customization starts from a clean slate (the VMware pipeline
# offers the same switch).
- stage: redeploy
  jobs:
  - job: infra
    condition: eq('${{ parameters.redeploy }}', true)
    displayName: Redeploy the build machine
    steps:
    - task: PowerShell@2
      displayName: Set variables
      inputs:
        targetType: inline
        script: |
          $env:VAULT_ADDR="$(vault_addr)"
          $env:VAULT_TOKEN="$(vault_token)"
          $range = .devops/pipelines/scripts/network-plan.ps1 -Platform nutanix
          @(
            "network_list = $($range | ConvertTo-Json -Compress)"
          ) | Set-Content terraform/nutanix/infra/terraform.tfvars
    - task: CmdLine@2
      displayName: Terraform init
      inputs:
        workingDirectory: terraform/nutanix/infra
        script: terraform init -backend-config="conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)"
    - task: CmdLine@2
      displayName: Terraform replace build machine
      inputs:
        workingDirectory: terraform/nutanix/infra
        script: terraform apply -auto-approve -replace='module.windows_workloads["build-2022"].nutanix_virtual_machine.vm[0]' -target='module.windows_workloads["build-2022"]' -var="vault_address=$(vault_addr)" -var="vault_token=$(vault_token)"

- stage: customize
  dependsOn: redeploy
  jobs:
  # The template stage powers the build VM off. Bring it back before WinRM.
  - job: poweron
    displayName: Power on build VM
    steps:
    - task: PowerShell@2
      displayName: Power on build-2022-1
      inputs:
        targetType: inline
        script: |
          $env:VAULT_FORMAT = "json"
          $env:VAULT_ADDR = "$(vault_addr)"
          $env:VAULT_TOKEN = "$(vault_token)"

          $pe = vault kv get -format json -mount=go nutanix/prism | ConvertFrom-Json
          $password = ConvertTo-SecureString $pe.data.password -AsPlainText -Force
          $skipTls = ($pe.data.insecure -eq $true) -or ("$($pe.data.insecure)" -eq "true")

          $helper = Join-Path "$(Build.Repository.LocalPath)" "scripts/nutanix/Invoke-PrismElement.ps1"
          & $helper `
            -Endpoint $pe.data.endpoint `
            -Username $pe.data.username `
            -Password $password `
            -Action PowerOnVm `
            -Name "build-2022-1" `
            -SkipCertificateCheck:$skipTls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # WinRM is not up the instant AHV reports ON.
          Start-Sleep -Seconds 90
  - template: ../templates/ansible-playbook.yml
    parameters:
      ansible_path: $(Build.Repository.LocalPath)/ansible
      ansible_playbook: windows-image.yml
      vault_addr: $(vault_addr)
      vault_token: $(vault_token)
      # The windows-image role compares this value in lowercase.
      delivery: ${{ lower(parameters.delivery) }}
      platform: nutanix
      terraform_backend: conn_str=postgres://$(postgress_user):$(postgress_password)@$(postgress_address)/state?sslmode=$(postgress_ssl)
      terraform_path: $(Build.Repository.LocalPath)/terraform/nutanix/infra
      dependsOn: poweron

# Citrix 2603 MCS on Nutanix AHV Prism Central picks a VM template version
# when creating or updating a machine catalog. Power off the customized
# build VM and publish it under a stable name so later Delivery runs add
# a new version instead of a second template.
- stage: template
  displayName: Publish Nutanix template
  dependsOn: customize
  jobs:
  - job: publish
    displayName: Convert build VM to template
    steps:
    - task: PowerShell@2
      displayName: Publish Prism Central VM template
      inputs:
        targetType: inline
        script: |
          $env:VAULT_FORMAT = "json"
          $env:VAULT_ADDR = "$(vault_addr)"
          $env:VAULT_TOKEN = "$(vault_token)"

          $pc = vault kv get -format json -mount=go nutanix/prism_central | ConvertFrom-Json
          $pe = vault kv get -format json -mount=go nutanix/prism | ConvertFrom-Json

          $pcPassword = ConvertTo-SecureString $pc.data.password -AsPlainText -Force
          $pePassword = ConvertTo-SecureString $pe.data.password -AsPlainText -Force
          $skipTls = ($pc.data.insecure -eq $true) -or ("$($pc.data.insecure)" -eq "true")

          $templateName = "go-euc-${{ lower(parameters.delivery) }}-2022"
          $versionName = "$(Build.BuildNumber)"
          $description = "GO-EUC ${{ parameters.delivery }} master from build-2022-1 (build $(Build.BuildId))"

          $publish = Join-Path "$(Build.Repository.LocalPath)" "scripts/nutanix/Publish-VmTemplate.ps1"
          & $publish `
            -PrismCentralEndpoint $pc.data.endpoint `
            -Username $pc.data.username `
            -Password $pcPassword `
            -PrismElementEndpoint $pe.data.endpoint `
            -PrismElementPassword $pePassword `
            -VmName "build-2022-1" `
            -TemplateName $templateName `
            -VersionName $versionName `
            -VersionDescription $description `
            -SkipCertificateCheck:$skipTls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
