# Utility pipeline: enable or disable the temporary dnsmasq DHCP container on
# the control-plane VM outside an image pipeline run. The image pipeline
# normally manages the container itself (starts it before the builds, removes
# it afterwards); this pipeline covers manual runs — for example starting
# DHCP for troubleshooting a build VM, or cleaning up a container left behind
# by a cancelled run before the domain controller's DHCP goes live.
parameters:
- name: enable
  displayName: Enable the build DHCP server (disable removes it)
  type: boolean
  default: true

trigger: none
pr: none

pool: GO Pipelines

variables:
- group: Lab

stages:
# Vault starts sealed after a control-plane reboot; unseal first so the DHCP
# template can read the docker and network secrets.
- stage: unseal
  jobs:
  - job: vault
    steps:
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: |
          $env:VAULT_ADDR="$(vault_addr)"
          $env:VAULT_TOKEN="$(vault_token)"
          if ((vault status -format=json | ConvertFrom-Json).sealed) {
            vault operator unseal $(vault_unseal_1)
            vault operator unseal $(vault_unseal_2)
            vault operator unseal $(vault_unseal_3)
          }

- ${{ if parameters.enable }}:
  - template: ../templates/nutanix-dhcp.yml
    parameters:
      stage_name: dhcp_up
      display_name: Start build DHCP
      dhcp_state: started
      depends_on: [unseal]

- ${{ else }}:
  - template: ../templates/nutanix-dhcp.yml
    parameters:
      stage_name: dhcp_down
      display_name: Remove build DHCP
      dhcp_state: absent
      depends_on: [unseal]
