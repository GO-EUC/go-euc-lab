trigger: none
pr: none

pool: GO Pipelines

variables:
- group: Lab

# Each stage builds a Windows image from the ISO in the software store /
# Prism image library using the Packer Nutanix builder against Prism Central,
# then publishes a Prism Element manifest consumed by the infra pipeline.
stages:
- template: ../templates/nutanix-packer-image.yml
  parameters:
    stage_name: image_win_10
    display_name: Image creation Windows 10
    iso_match: windows_10
    template_path: packer/nutanix/windows/desktop/10
    image_name: windows-desktop-10

- template: ../templates/nutanix-packer-image.yml
  parameters:
    stage_name: image_win_11
    display_name: Image creation Windows 11
    iso_match: windows_11
    template_path: packer/nutanix/windows/desktop/11
    image_name: windows-desktop-11

- template: ../templates/nutanix-packer-image.yml
  parameters:
    stage_name: image_server_19
    display_name: Image creation Server 2019
    iso_match: windows_server_2019
    template_path: packer/nutanix/windows/server/2019
    image_name: windows-server-2019-standard

- template: ../templates/nutanix-packer-image.yml
  parameters:
    stage_name: image_server_22
    display_name: Image creation Server 2022
    iso_match: windows_server_2022
    template_path: packer/nutanix/windows/server/2022
    image_name: windows-server-2022-standard

- template: ../templates/nutanix-packer-image.yml
  parameters:
    stage_name: image_server_25
    display_name: Image creation Server 2025
    iso_match: windows_server_2025
    template_path: packer/nutanix/windows/server/2025
    image_name: windows-server-2025-standard
