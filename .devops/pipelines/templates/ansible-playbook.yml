parameters:

- name: terraform_backend
  type: string

- name: terraform_path
  type: string

- name: vault_addr
  type: string

- name: vault_token
  type: string

- name: ansible_path
  type: string

- name: ansible_playbook
  type: string

- name: build
  type: string
  default: 'none'

- name: delivery
  type: string
  default: 'none'

- name: platform
  type: string
  default: 'vmware'

jobs:
- job: ansible
  displayName: Ansible deployment

  steps:
  - task: CmdLine@2
    displayName: Terraform init
    inputs:
      script: 'terraform init -backend-config="${{ parameters.terraform_backend }}"'
      workingDirectory: '${{ parameters.terraform_path }}'

  - task: CmdLine@2
    displayName: Terraform pull state
    inputs:
      script: 'terraform state pull > download.tfstate'
      workingDirectory: '${{ parameters.terraform_path }}'

  - task: PowerShell@2
    displayName: Generate Ansible inventory file
    inputs:
      filePath: '$(Build.Repository.LocalPath)/.devops/pipelines/scripts/inventory.ps1'
      arguments: '-StateFile "${{ parameters.terraform_path }}/download.tfstate" -InventoryFile "${{ parameters.terraform_path }}/inventory"'

  - task: PowerShell@2
    displayName: Run playbook
    inputs:
      targetType: 'inline'
      script: |
        $env:delivery="${{ parameters.delivery }}"
        $env:build="${{ parameters.build }}"
        $env:platform="${{ parameters.platform }}"

        # software_store points at the NGINX container on the control-plane VM
        # (the same host that runs Postgres); the playbooks use it to discover
        # installer versions from the autoindex listings.
        $ansible_param = "-i ${{ parameters.terraform_path }}/inventory -e vault_token=${{ parameters.vault_token }} -e vault_addr=${{ parameters.vault_addr }} -e software_store=http://$(postgress_address):8080 -e go_euc_platform=${{ parameters.platform }}"
        if ($env:build -ne "none") {
          Write-Output "Build select"
          [int]$build_id = $env:build -replace "[^0-9]" , ''
          Write-Output "Build id: $($build_id -1)"
          $ansible_param += " -e build_id=$($build_id -1)"
        }

        # Invoke directly (not Start-Process) so ADO waits on ansible-playbook
        # and propagates its exit code instead of orphaning the process.
        $playbook = "${{ parameters.ansible_path }}/${{ parameters.ansible_playbook }}"
        & ansible-playbook $playbook ($ansible_param -split '\s+')
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
