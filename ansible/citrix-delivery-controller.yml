---
- hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
  - name: Install requirements
    include_tasks: vault.yml

- name: Domain join the Citrix Delivery Controller
  hosts: citrix_ddc
  # WinRM can return HTTP 400 while the guest is still settling after a
  # reboot or a failed installer pass; wait before the first module call.
  gather_facts: no
  pre_tasks:
    - name: Wait for WinRM to become ready
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 15
      retries: 10
      delay: 30
    - name: Gathering Facts
      ansible.builtin.setup:
  roles:
    - rdp
    - domain-join
  vars_files:
    - ansible.yml
    - local.yml
  vars:
    ou_path: "OU=Infra,OU=Machines,OU=GO"

- name: Install and configure Citrix Delivery Controller
  hosts: citrix_ddc
  # Domain credentials need the DC reachable over DNS; the join play above
  # re-points DNS, then this wait absorbs any brief auth settle time.
  gather_facts: no
  pre_tasks:
    - name: Wait for domain credentials to be accepted
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 15
      retries: 10
      delay: 30
    - name: Gathering Facts
      ansible.builtin.setup:
  roles:
    - citrix-delivery-controller
  vars_files:
    - citrix.yml
    - ansible.yml
    - domain.yml
    - accounts.yml
    # vSphere host/user live here; the hosting task only uses them on VMware.
    # Nutanix cluster/storage/network names come from vault.yml via accounts.yml.
    - vmware.yml
