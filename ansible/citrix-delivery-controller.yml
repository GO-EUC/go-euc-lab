---
- hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
  - name: Install requirements
    include_tasks: vault.yml

- name: Domain join the Citrix Delivery Controller
  hosts: citrix_ddc
  roles:
    - rdp
    - domain-join
  vars_files:
    - ansible.yml
    - local.yml
  vars:
    ou_path: "OU=Infra,OU=Machines,OU=GO"

- name: Install and configure Citrix Delivery Controller
  hosts: citrix_ddc
  # Domain credentials need the DC reachable over DNS; the join play above
  # re-points DNS, then this wait absorbs any brief auth settle time.
  gather_facts: no
  pre_tasks:
    - name: Wait for domain credentials to be accepted
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 15
      retries: 5
      delay: 15
    - name: Gathering Facts
      ansible.builtin.setup:
  roles:
    - citrix-delivery-controller
  vars_files:
    - citrix.yml
    - ansible.yml
    - domain.yml
    # vmware.yml supplies the vSphere endpoint for the hosting connection
    # (the task only runs on the VMware platform).
    - vmware.yml