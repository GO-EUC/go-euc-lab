---
- hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
  - name: Install requirements and collect secrets
    include_tasks: vault.yml

- name: Install Windows Updates and set timezone
  # build-2022 is a delivery clone source and is never domain-joined here;
  # domain credentials would be rejected (NTLM) if it stayed in `all`.
  hosts: all:!build
  tasks:

    - name: "Set timezone to '{{ windows_timezone | default('W. Europe Standard Time') }}'"
      win_timezone:
        timezone: "{{ windows_timezone | default('W. Europe Standard Time') }}"

    - name: Force reboot before
      win_reboot:

    - name: Install Windows Updates
      win_updates:
        category_names: '*'
        reboot: no
        state: installed
        log_path: C:\Windows\Temp\ansible_updates.txt

    - name: Force reboot after the Windows Updates
      win_reboot:
        reboot_timeout: 3600

  vars_files:
    - ansible.yml
    - domain.yml