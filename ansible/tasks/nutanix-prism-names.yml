---
# Fill hosting names that Vault does not yet have. Citrix XDHyp matches
# cluster, storage container, and VLAN by name. Init seeds those names when
# it can; this path covers labs whose go/nutanix/* secrets still have UUIDs
# only. Resolved names are written back so later plays do not call Prism.
- name: Query Prism Element clusters
  ansible.builtin.uri:
    url: "https://{{ nutanix_host }}:9440/PrismGateway/services/rest/v2.0/clusters/"
    user: "{{ nutanix_username }}"
    password: "{{ nutanix_password }}"
    force_basic_auth: true
    validate_certs: false
  register: pe_clusters
  when: nutanix_cluster_name | length == 0

- name: Query Prism Element storage containers
  ansible.builtin.uri:
    url: "https://{{ nutanix_host }}:9440/PrismGateway/services/rest/v2.0/storage_containers/"
    user: "{{ nutanix_username }}"
    password: "{{ nutanix_password }}"
    force_basic_auth: true
    validate_certs: false
  register: pe_storage
  when: nutanix_storage_name | length == 0

- name: Query Prism Element networks
  ansible.builtin.uri:
    url: "https://{{ nutanix_host }}:9440/PrismGateway/services/rest/v2.0/networks/"
    user: "{{ nutanix_username }}"
    password: "{{ nutanix_password }}"
    force_basic_auth: true
    validate_certs: false
  register: pe_networks
  when: nutanix_network_name | length == 0

- name: Match the cluster name
  ansible.builtin.set_fact:
    nutanix_cluster_name: "{{ item.name }}"
  loop: "{{ (pe_clusters.json | default({})).entities | default([]) }}"
  when:
    - nutanix_cluster_name | length == 0
    - (item.uuid | default('')) == nutanix_cluster.data.data.uuid

- name: Match the storage container name
  ansible.builtin.set_fact:
    nutanix_storage_name: "{{ item.name }}"
  loop: "{{ (pe_storage.json | default({})).entities | default([]) }}"
  when:
    - nutanix_storage_name | length == 0
    - (item.storage_container_uuid | default('')) == nutanix_storage.data.data.container_uuid or (item.uuid | default('')) == nutanix_storage.data.data.container_uuid or (item.id | default('')) == nutanix_storage.data.data.container_uuid

- name: Match the network name
  ansible.builtin.set_fact:
    nutanix_network_name: "{{ item.name }}"
  loop: "{{ (pe_networks.json | default({})).entities | default([]) }}"
  when:
    - nutanix_network_name | length == 0
    - (item.uuid | default('')) == network.data.data.subnet_uuid

- name: Fail when hosting names are still missing
  ansible.builtin.fail:
    msg: >-
      Vault is missing Nutanix hosting names and Prism Element
      ({{ nutanix_host }}) did not resolve them.
      cluster='{{ nutanix_cluster_name }}'
      storage='{{ nutanix_storage_name }}'
      network='{{ nutanix_network_name }}'.
      Set name on go/nutanix/cluster, go/nutanix/storage, and go/nutanix/network.
  when: nutanix_cluster_name | length == 0 or nutanix_storage_name | length == 0 or nutanix_network_name | length == 0

# KV v1 write replaces the secret; merge so uuid and other keys stay.
- name: Persist the cluster name in vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    path: go/nutanix/cluster
    token: "{{ vault_token }}"
    data: "{{ nutanix_cluster.data.data | combine({'name': nutanix_cluster_name}) }}"
  when: nutanix_cluster.data.data.name | default('') != nutanix_cluster_name

- name: Persist the storage container name in vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    path: go/nutanix/storage
    token: "{{ vault_token }}"
    data: "{{ nutanix_storage.data.data | combine({'name': nutanix_storage_name}) }}"
  when: nutanix_storage.data.data.name | default('') != nutanix_storage_name

- name: Persist the network name in vault
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    path: go/nutanix/network
    token: "{{ vault_token }}"
    data: "{{ network.data.data | combine({'name': nutanix_network_name}) }}"
  when: network.data.data.name | default('') != nutanix_network_name
