---
- name: Install hvac
  ansible.builtin.pip:
    name: hvac

- name: Install netaddr
  ansible.builtin.pip:
    name: netaddr

- name: Set platform defaults
  ansible.builtin.set_fact:
    go_euc_platform: "{{ go_euc_platform | default(lookup('env', 'platform') | default('vmware', true), true) }}"

- name: Read build credentials from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/build
    token : '{{ vault_token }}'
  register: build

- name: Read domain info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/domain
    token : '{{ vault_token }}'
  register: domain

- name: Read domain accounts info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/domain/accounts
    token : '{{ vault_token }}'
  register: accounts

- name: Read network info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: "go/{{ go_euc_platform }}/network"
    token : '{{ vault_token }}'
  register: network

- name: Read VMware vCenter info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/vmware/vcsa
    token : '{{ vault_token }}'
  register: vcsa
  when: go_euc_platform == 'vmware'

- name: Read Nutanix Prism info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/nutanix/prism
    token : '{{ vault_token }}'
  register: prism
  when: go_euc_platform == 'nutanix'

- name: Read Nutanix Prism Central info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/nutanix/prism_central
    token : '{{ vault_token }}'
  register: prism_central
  when: go_euc_platform == 'nutanix'

- name: Read Nutanix cluster info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/nutanix/cluster
    token : '{{ vault_token }}'
  register: nutanix_cluster
  when: go_euc_platform == 'nutanix'

- name: Read Nutanix storage info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/nutanix/storage
    token : '{{ vault_token }}'
  register: nutanix_storage
  when: go_euc_platform == 'nutanix'

# The influx secret only feeds the optional telegraf monitoring role and is
# not present until the monitoring stack has been deployed (the docker stage
# of the infra pipeline), so a missing secret must not fail the playbook.
- name: Read influx info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/influx
    token : '{{ vault_token }}'
  register: influx
  failed_when: false

- name: Set variables
  set_fact:
    ansible_local_user: "{{ build.data.data.user }}"
    ansible_local_password: "{{ build.data.data.password }}"
    dns_domain_name: "{{ domain.data.data.name }}"
    # Windows timezone id, seeded into go/domain from the initializer's
    # settings.json; labs without the key keep the historical default.
    windows_timezone: "{{ domain.data.data.timezone | default('W. Europe Standard Time', true) }}"
    reverse_dns_zone:  "{{ network.data.data.cidr }}"
    dhcp_router:  "{{ network.data.data.cidr | ansible.utils.ipmath(network.data.data.gateway) }}"
    dhcp_subnetmask: "{{ network.data.data.cidr | ansible.utils.ipaddr('netmask') }}"
    public_dns1: "{{ network.data.data.cidr | ansible.utils.ipmath(network.data.data.dns) }}"
    public_dns2: "{{ network.data.data.cidr | ansible.utils.ipmath(network.data.data.dns) }}"
    dhcp_start_range: "{{ network.data.data.cidr | ansible.utils.ipmath(network.data.data.start) }}"
    dhcp_end_range: "{{ network.data.data.cidr | ansible.utils.ipmath(network.data.data.end) }}"
    ansible: "{{ accounts.data.data.ansible }}"
    loadgen: "{{ accounts.data.data.loadgen }}"
    loadgen_bot: "{{ accounts.data.data.loadgen_bot }}"
    sql_agt: "{{ accounts.data.data.sql_agt }}"
    sql_svc: "{{ accounts.data.data.sql_svc }}"
    vsphere_username: "{{ (vcsa.data.data.user if (vcsa.data is defined and vcsa.data.data is defined) else '') | default('') }}"
    vsphere_password: "{{ (vcsa.data.data.password if (vcsa.data is defined and vcsa.data.data is defined) else '') | default('') }}"
    vsphere_host: "{{ (vcsa.data.data.name if (vcsa.data is defined and vcsa.data.data is defined) else '') | default('') }}"
    nutanix_username: "{{ (prism.data.data.username if (prism.data is defined and prism.data.data is defined) else '') | default('') }}"
    nutanix_password: "{{ (prism.data.data.password if (prism.data is defined and prism.data.data is defined) else '') | default('') }}"
    nutanix_host: "{{ (prism.data.data.endpoint if (prism.data is defined and prism.data.data is defined) else '') | default('') }}"
    nutanix_pc_username: "{{ (prism_central.data.data.username if (prism_central.data is defined and prism_central.data.data is defined) else '') | default('') }}"
    nutanix_pc_password: "{{ (prism_central.data.data.password if (prism_central.data is defined and prism_central.data.data is defined) else '') | default('') }}"
    nutanix_pc_host: "{{ (prism_central.data.data.endpoint if (prism_central.data is defined and prism_central.data.data is defined) else '') | default('') }}"
    nutanix_cluster_name: ""
    nutanix_storage_name: ""
    nutanix_network_name: ""
    # The URL and org fall back to the hosted GO-EUC instance for labs whose
    # go/influx secret predates the in-lab monitoring stack (token only).
    influx_token: "{{ influx.data.data.token | default('') }}"
    influx_url: "{{ influx.data.data.url | default('https://influx.logitblog.com') }}"
    influx_org: "{{ influx.data.data.org | default('GO') }}"

# Citrix hosting uses display names. Read them from Vault first (init seeds
# name on cluster/storage/network; some labs also store aliases on prism).
# Query Prism only when a name is still missing, then write it back.
- name: Set Nutanix hosting names from vault
  ansible.builtin.set_fact:
    nutanix_cluster_name: "{{ nutanix_cluster.data.data.name | default(nutanix_cluster.data.data.cluster_name | default(prism.data.data.cluster_name | default(''), true), true) }}"
    nutanix_storage_name: "{{ nutanix_storage.data.data.name | default(nutanix_storage.data.data.container_name | default(nutanix_storage.data.data.storage_name | default(prism.data.data.storage_container_name | default(''), true), true), true) }}"
    nutanix_network_name: "{{ network.data.data.name | default(network.data.data.network_name | default(network.data.data.subnet_name | default(prism.data.data.subnet_name | default(''), true), true), true) }}"
  when: go_euc_platform == 'nutanix'

- name: Resolve missing Nutanix hosting names from Prism
  ansible.builtin.include_tasks: tasks/nutanix-prism-names.yml
  when:
    - go_euc_platform == 'nutanix'
    - nutanix_cluster_name | length == 0 or nutanix_storage_name | length == 0 or nutanix_network_name | length == 0

- name: Report Nutanix hosting names
  ansible.builtin.debug:
    msg: "Citrix hosting names cluster={{ nutanix_cluster_name }} storage={{ nutanix_storage_name }} network={{ nutanix_network_name }}"
  when: go_euc_platform == 'nutanix'

# ---------------------------------------------------------------------------
# Software store discovery. The NGINX store serves autoindex listings, so
# ISO / VDA / Optimizer URLs are resolved at run time. Two layouts are
# supported: version folders (Citrix/CVAD/<version>/<iso>) and a flat folder
# with the version in the filename. The store address comes from the
# software_store extra-var, or from the control-plane IP in go/docker.
- name: Read docker info from vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: go/docker
    token: "{{ vault_token }}"
  register: docker
  failed_when: false

- name: Set the software store URL from the control-plane address
  ansible.builtin.set_fact:
    software_store: "http://{{ docker.data.data.ip }}:8080"
  when:
    - software_store is not defined
    - docker.data is defined
    - docker.data.data is defined
    - docker.data.data.ip is defined

- name: Read the CVAD folder listing from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/Citrix/CVAD/"
    return_content: true
  register: cvad_index
  failed_when: false
  when: software_store is defined

- name: Collect the CVAD version folders and ISO files
  ansible.builtin.set_fact:
    cvad_versions: "{{ cvad_index.content | default('') | regex_findall('href=\"([0-9]+)/\"') }}"
    cvad_isos: "{{ cvad_index.content | default('') | regex_findall('href=\"([^\"]+[.]iso)\"') }}"
  when:
    - software_store is defined
    - cvad_index.status | default(0) == 200

- name: Set the discovered CVAD version
  ansible.builtin.set_fact:
    citrix_version_discovered: "{{ cvad_versions | map('int') | max | string }}"
  when: cvad_versions | default([]) | length > 0

- name: Read the latest CVAD version folder from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/Citrix/CVAD/{{ citrix_version_discovered }}/"
    return_content: true
  register: cvad_folder
  failed_when: false
  when: citrix_version_discovered is defined

- name: Set the discovered CVAD ISO name
  ansible.builtin.set_fact:
    citrix_source_discovered: "{{ cvad_folder.content | regex_findall('href=\"([^\"]+[.]iso)\"') | first }}"
    citrix_iso_url: "{{ software_store }}/Citrix/CVAD/{{ citrix_version_discovered }}/{{ cvad_folder.content | regex_findall('href=\"([^\"]+[.]iso)\"') | first }}"
  when:
    - citrix_version_discovered is defined
    - cvad_folder.status | default(0) == 200
    - cvad_folder.content | default('') | regex_findall('href=\"([^\"]+[.]iso)\"') | length > 0

# Flat layout: the ISOs sit directly in Citrix/CVAD/ and the shared filename
# prefix makes a lexical sort pick the highest version.
- name: Set the discovered CVAD ISO from a flat store layout
  ansible.builtin.set_fact:
    citrix_source_discovered: "{{ cvad_isos | sort | last }}"
    citrix_version_discovered: "{{ cvad_isos | sort | last | regex_search('_7_([0-9]{4})', '\\1') | first }}"
    citrix_iso_url: "{{ software_store }}/Citrix/CVAD/{{ cvad_isos | sort | last }}"
  when:
    - cvad_versions | default([]) | length == 0
    - cvad_isos | default([]) | length > 0

# VDA standalone setups may sit next to the ISO, in Citrix/CVAD/, or in a
# VDA/ subfolder. Prefer a filename that contains the discovered version.
- name: Collect VDA installers from the CVAD version folder
  ansible.builtin.set_fact:
    cvad_vda_server_files: "{{ cvad_folder.content | default('') | regex_findall('href=\"([^\"]*VDAServerSetup[^\"]*[.]exe)\"') }}"
    cvad_vda_workstation_files: "{{ cvad_folder.content | default('') | regex_findall('href=\"([^\"]*VDAWorkstationSetup[^\"]*[.]exe)\"') }}"
    cvad_vda_subfolders: "{{ cvad_folder.content | default('') | regex_findall('href=\"((?![.]{2}/)[^\"]*[Vv][Dd][Aa][^\"]*)/\"') }}"
  when: cvad_folder.status | default(0) == 200

- name: Read a VDA subfolder from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/Citrix/CVAD/{{ citrix_version_discovered }}/{{ cvad_vda_subfolders | first }}/"
    return_content: true
  register: cvad_vda_folder
  failed_when: false
  when:
    - citrix_version_discovered is defined
    - cvad_vda_subfolders | default([]) | length > 0
    - (cvad_vda_server_files | default([]) | length == 0) or (cvad_vda_workstation_files | default([]) | length == 0)

- name: Merge VDA installers from the VDA subfolder
  ansible.builtin.set_fact:
    cvad_vda_server_files: "{{ (cvad_vda_server_files | default([])) + (cvad_vda_folder.content | default('') | regex_findall('href=\"([^\"]*VDAServerSetup[^\"]*[.]exe)\"') | map('regex_replace', '^', (cvad_vda_subfolders | first) ~ '/') | list) }}"
    cvad_vda_workstation_files: "{{ (cvad_vda_workstation_files | default([])) + (cvad_vda_folder.content | default('') | regex_findall('href=\"([^\"]*VDAWorkstationSetup[^\"]*[.]exe)\"') | map('regex_replace', '^', (cvad_vda_subfolders | first) ~ '/') | list) }}"
  when: cvad_vda_folder.status | default(0) == 200

- name: Collect VDA installers from a flat CVAD folder
  ansible.builtin.set_fact:
    cvad_vda_server_files: "{{ (cvad_vda_server_files | default([])) + (cvad_index.content | default('') | regex_findall('href=\"([^\"]*VDAServerSetup[^\"]*[.]exe)\"')) }}"
    cvad_vda_workstation_files: "{{ (cvad_vda_workstation_files | default([])) + (cvad_index.content | default('') | regex_findall('href=\"([^\"]*VDAWorkstationSetup[^\"]*[.]exe)\"')) }}"
  when: cvad_index.status | default(0) == 200

- name: Choose the VDA server installer file
  ansible.builtin.set_fact:
    citrix_vda_server_file: "{{ (cvad_vda_server_files | select('search', citrix_version_discovered | default('')) | list | first) | default(cvad_vda_server_files | first, true) }}"
  when: cvad_vda_server_files | default([]) | length > 0

- name: Choose the VDA workstation installer file
  ansible.builtin.set_fact:
    citrix_vda_workstation_file: "{{ (cvad_vda_workstation_files | select('search', citrix_version_discovered | default('')) | list | first) | default(cvad_vda_workstation_files | first, true) }}"
  when: cvad_vda_workstation_files | default([]) | length > 0

- name: Set the VDA server installer URL
  ansible.builtin.set_fact:
    citrix_vda_server_url: "{{ software_store }}/Citrix/CVAD/{{ citrix_version_discovered }}/{{ citrix_vda_server_file }}"
  when:
    - citrix_vda_server_file is defined
    - citrix_version_discovered is defined
    - citrix_vda_server_file is search('/') or (cvad_folder.content | default('') | regex_search('href=\"' ~ citrix_vda_server_file ~ '\"'))

- name: Set the VDA server installer URL from the CVAD root
  ansible.builtin.set_fact:
    citrix_vda_server_url: "{{ software_store }}/Citrix/CVAD/{{ citrix_vda_server_file }}"
  when:
    - citrix_vda_server_file is defined
    - citrix_vda_server_url is not defined

- name: Set the VDA workstation installer URL
  ansible.builtin.set_fact:
    citrix_vda_workstation_url: "{{ software_store }}/Citrix/CVAD/{{ citrix_version_discovered }}/{{ citrix_vda_workstation_file }}"
  when:
    - citrix_vda_workstation_file is defined
    - citrix_version_discovered is defined
    - citrix_vda_workstation_file is search('/') or (cvad_folder.content | default('') | regex_search('href=\"' ~ citrix_vda_workstation_file ~ '\"'))

- name: Set the VDA workstation installer URL from the CVAD root
  ansible.builtin.set_fact:
    citrix_vda_workstation_url: "{{ software_store }}/Citrix/CVAD/{{ citrix_vda_workstation_file }}"
  when:
    - citrix_vda_workstation_file is defined
    - citrix_vda_workstation_url is not defined

- name: Read the Citrix Optimizer folder listing from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/Citrix/Optimizer/"
    return_content: true
  register: optimizer_index
  failed_when: false
  when: software_store is defined

- name: Collect Optimizer version folders and zip files
  ansible.builtin.set_fact:
    optimizer_versions: "{{ optimizer_index.content | default('') | regex_findall('href=\"([0-9]+)/\"') }}"
    optimizer_zips: "{{ optimizer_index.content | default('') | regex_findall('href=\"([^\"]+[Oo]ptimizer[^\"]*[.]zip)\"') }}"
  when:
    - software_store is defined
    - optimizer_index.status | default(0) == 200

- name: Set the discovered Optimizer version
  ansible.builtin.set_fact:
    citrix_optimizer_version_discovered: "{{ optimizer_versions | map('int') | max | string }}"
  when: optimizer_versions | default([]) | length > 0

- name: Read the latest Optimizer version folder from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/Citrix/Optimizer/{{ citrix_optimizer_version_discovered }}/"
    return_content: true
  register: optimizer_folder
  failed_when: false
  when: citrix_optimizer_version_discovered is defined

- name: Set the discovered Optimizer zip from a version folder
  ansible.builtin.set_fact:
    citrix_optimizer_url: "{{ software_store }}/Citrix/Optimizer/{{ citrix_optimizer_version_discovered }}/{{ (optimizer_folder.content | regex_findall('href=\"([^\"]+[.]zip)\"') | first) }}"
  when:
    - citrix_optimizer_version_discovered is defined
    - optimizer_folder.status | default(0) == 200
    - optimizer_folder.content | default('') | regex_findall('href=\"([^\"]+[.]zip)\"') | length > 0

- name: Set the discovered Optimizer zip from a flat store layout
  ansible.builtin.set_fact:
    citrix_optimizer_url: "{{ software_store }}/Citrix/Optimizer/{{ optimizer_zips | sort | last }}"
  when:
    - citrix_optimizer_url is not defined
    - optimizer_zips | default([]) | length > 0

# This lab currently keeps the Optimizer zip next to the CVAD ISO rather
# than under Citrix/Optimizer/. Accept that layout (and a zip in Citrix/).
- name: Set the discovered Optimizer zip from the CVAD folder
  ansible.builtin.set_fact:
    citrix_optimizer_url: "{{ software_store }}/Citrix/CVAD/{{ (cvad_index.content | default('') | regex_findall('href=\"([^\"]+[Oo]ptimizer[^\"]*[.]zip)\"') | first) }}"
  when:
    - citrix_optimizer_url is not defined
    - cvad_index.status | default(0) == 200
    - cvad_index.content | default('') | regex_findall('href=\"([^\"]+[Oo]ptimizer[^\"]*[.]zip)\"') | length > 0

- name: Read the Citrix folder listing from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/Citrix/"
    return_content: true
  register: citrix_index
  failed_when: false
  when:
    - software_store is defined
    - citrix_optimizer_url is not defined

- name: Set the discovered Optimizer zip from the Citrix folder
  ansible.builtin.set_fact:
    citrix_optimizer_url: "{{ software_store }}/Citrix/{{ (citrix_index.content | default('') | regex_findall('href=\"([^\"]+[Oo]ptimizer[^\"]*[.]zip)\"') | first) }}"
  when:
    - citrix_optimizer_url is not defined
    - citrix_index.status | default(0) == 200
    - citrix_index.content | default('') | regex_findall('href=\"([^\"]+[Oo]ptimizer[^\"]*[.]zip)\"') | length > 0

- name: Report discovered Citrix delivery media
  ansible.builtin.debug:
    msg: >-
      CVAD {{ citrix_version_discovered | default('unknown') }}
      VDA server={{ citrix_vda_server_url | default('missing') }}
      VDA workstation={{ citrix_vda_workstation_url | default('missing') }}
      Optimizer={{ citrix_optimizer_url | default('missing') }}
  when: software_store is defined

# Same discovery for VMware Horizon (VMware/Horizon/<version>/<installers>).
- name: Read the Horizon folder listing from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/VMware/Horizon/"
    return_content: true
  register: horizon_index
  failed_when: false
  when: software_store is defined

- name: Collect the Horizon version folders
  ansible.builtin.set_fact:
    horizon_versions: "{{ horizon_index.content | default('') | regex_findall('href=\"([0-9]+)/\"') }}"
  when:
    - software_store is defined
    - horizon_index.status | default(0) == 200

- name: Set the discovered Horizon version
  ansible.builtin.set_fact:
    horizon_version_discovered: "{{ horizon_versions | map('int') | max | string }}"
  when: horizon_versions | default([]) | length > 0

- name: Read the latest Horizon version folder from the software store
  ansible.builtin.uri:
    url: "{{ software_store }}/VMware/Horizon/{{ horizon_version_discovered }}/"
    return_content: true
  register: horizon_folder
  failed_when: false
  when: horizon_version_discovered is defined

- name: Set the discovered Horizon Connection Server installer
  ansible.builtin.set_fact:
    horizon_server_discovered: "{{ horizon_folder.content | regex_findall('href=\"(VMware-Horizon-Connection-Server[^\"]+[.]exe)\"') | first }}"
  when:
    - horizon_version_discovered is defined
    - horizon_folder.status | default(0) == 200
    - horizon_folder.content | default('') | regex_findall('href=\"(VMware-Horizon-Connection-Server[^\"]+[.]exe)\"') | length > 0

- name: Set the discovered Horizon Agent installer
  ansible.builtin.set_fact:
    horizon_agent_discovered: "{{ horizon_folder.content | regex_findall('href=\"(VMware-Horizon-Agent[^\"]+[.]exe)\"') | first }}"
  when:
    - horizon_version_discovered is defined
    - horizon_folder.status | default(0) == 200
    - horizon_folder.content | default('') | regex_findall('href=\"(VMware-Horizon-Agent[^\"]+[.]exe)\"') | length > 0
