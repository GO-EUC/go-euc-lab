nutanix_pc_password: "{{ hostvars['localhost']['nutanix_pc_password'] | default('') }}"
nutanix_pc_username: "{{ hostvars['localhost']['nutanix_pc_username'] | default('') }}"
nutanix_pc_host: "{{ hostvars['localhost']['nutanix_pc_host'] | default('') }}"
