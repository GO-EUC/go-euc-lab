---
ansible: "{{ hostvars['localhost']['ansible'] }}"
loadgen: "{{ hostvars['localhost']['loadgen'] }}"
loadgen_bot: "{{ hostvars['localhost']['loadgen_bot'] }}"
sql_agt: "{{ hostvars['localhost']['sql_agt'] }}"
sql_svc: "{{ hostvars['localhost']['sql_svc'] }}"
vsphere_password: "{{ hostvars['localhost']['vsphere_password'] | default('') }}"
