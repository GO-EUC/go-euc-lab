---
citrix:
  # Version, file names, and download URLs are discovered from the software
  # store listing at run time (see vault.yml). The store address is the
  # software_store extra-var (or go/docker in Vault), never a pinned host.
  version: "{{ hostvars['localhost']['citrix_version_discovered'] }}"
  source: "{{ hostvars['localhost']['citrix_source_discovered'] }}"
  path: "{{ software_store }}/Citrix/CVAD"
  iso_url: "{{ hostvars['localhost']['citrix_iso_url'] }}"
  vda_server_url: "{{ hostvars['localhost']['citrix_vda_server_url'] }}"
  vda_workstation_url: "{{ hostvars['localhost']['citrix_vda_workstation_url'] }}"
  site: Default
  database_port: 1433
  database_site: CVAD_Site_DB
  database_logging: CVAD_Logging_DB
  database_monitoring: CVAD_Monitoring_DB
  admin: Domain Admins
  role: Full Administrator
  scope: All
  grooming: 365
  optimizer:
    path: "{{ software_store }}/Citrix/Optimizer"
    version: "{{ hostvars['localhost']['citrix_optimizer_version_discovered'] | default('') }}"
    url: "{{ hostvars['localhost']['citrix_optimizer_url'] }}"
  licensing:
    port: 27000
    model: Concurrent
    code: XDT
    edition: PLT
  storefront:
    url: http://citrix.go.euc
    path: /Citrix/Store
    transport: http
    gateway:
      name: ADCGW1
      url: https://adc.go.euc
      sta_url: http://ctxddc-1/scripts/ctxa.dll
