---
citrix:
  # Version and ISO name are discovered from the software store listing at
  # run time (see vault.yml); the pinned values only apply when discovery is
  # unavailable. The store address comes from the pipeline (software_store).
  version: "{{ hostvars['localhost']['citrix_version_discovered'] | default('2407') }}"
  source: "{{ hostvars['localhost']['citrix_source_discovered'] | default('Citrix_Virtual_Apps_and_Desktops_7_2407.iso') }}"
  path: "{{ software_store | default('http://10.2.0.6:8080') }}/Citrix/CVAD"
  # Full download URL for the ISO, layout-aware (versioned or flat store).
  iso_url: "{{ hostvars['localhost']['citrix_iso_url'] | default((software_store | default('http://10.2.0.6:8080')) ~ '/Citrix/CVAD/2407/Citrix_Virtual_Apps_and_Desktops_7_2407.iso') }}"
  site: Default
  database_port: 1433
  database_site: CVAD_Site_DB
  database_logging: CVAD_Logging_DB
  database_monitoring: CVAD_Monitoring_DB
  admin: Domain Admins
  role: Full Administrator
  scope: All
  grooming: 365
  optimizer:
    path: "{{ software_store | default('http://10.2.0.6:8080') }}/Citrix/Optimizer"
    version: 3103
  licensing:
    port: 27000
    model: Concurrent
    code: XDT
    edition: PLT
  storefront:
    url: http://citrix.go.euc
    path: /Citrix/Store
    transport: http
    gateway:
      name: ADCGW1
      url: https://adc.go.euc
      sta_url: http://ctxddc-1/scripts/ctxa.dll
