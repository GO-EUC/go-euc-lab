---
vmware:
  # Version and installer names are discovered from the software store
  # listing at run time (see vault.yml); the pinned values only apply when
  # discovery is unavailable.
  version: "{{ hostvars['localhost']['horizon_version_discovered'] | default('2312') }}"
  source: "{{ hostvars['localhost']['horizon_server_discovered'] | default('VMware-Horizon-Connection-Server-x86_64-8.12.1-23574797.exe') }}"
  path: "{{ software_store }}/VMware/Horizon"
  agent:
    source: "{{ hostvars['localhost']['horizon_agent_discovered'] | default('VMware-Horizon-Agent-x86_64-2312.1-8.12.1-23507832.exe') }}"
  vsphere:
    host: 10.2.0.5
    username: administrator@vsphere.local
