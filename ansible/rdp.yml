---
- hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
  - name: Install requirements and collect secrets
    include_tasks: vault.yml

- name: Enable Remote Desktop
  hosts: all
  tasks:

    - name: Allow Remote Desktop connections
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    # Matches the VMware image preparation: NLA off so consoles and older
    # clients can connect without a full credential prompt up front.
    - name: Disable Network Level Authentication
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 0
        type: dword

    - name: Allow Remote Desktop through the firewall
      win_shell: Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

  # Local build credentials: this can run before the machines are domain
  # joined (that happens per-role in the later stages), and the build account
  # exists on every VM the images produce.
  vars_files:
    - ansible.yml
    - local.yml
