---
- hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
  - name: Install requirements
    include_tasks: vault.yml

- name: Domain join the Citrix License Server
  hosts: citrix_lic
  gather_facts: no
  pre_tasks:
    - name: Wait for WinRM to become ready
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 15
      retries: 10
      delay: 30
    - name: Gathering Facts
      ansible.builtin.setup:
  roles:
    - rdp
    - domain-join
  vars_files:
    - ansible.yml
    - local.yml
  vars:
    ou_path: "OU=Infra,OU=Machines,OU=GO"

- name: Install and configure Citrix License Server
  hosts: citrix_lic
  gather_facts: no
  pre_tasks:
    - name: Wait for domain credentials to be accepted
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 15
      retries: 10
      delay: 30
    - name: Gathering Facts
      ansible.builtin.setup:
  roles:
    - citrix-license-server
  vars_files:
    - citrix.yml
    - ansible.yml
    - domain.yml
