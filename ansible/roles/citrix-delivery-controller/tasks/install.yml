---
- name: Obtain information from registry for site check
  win_reg_stat:
    path: HKLM:\Software\GO-EUC\Citrix
    name: ddc_version
  register: citrix_version

# Do not trust the registry marker alone: XenDesktopServerSetup is multi-pass
# (reboot + RunOnce resume). A run can write ddc_version without BrokerService
# ever landing on disk.
- name: Check whether Citrix Delivery Controller is installed
  win_stat:
    path: C:\Program Files\Citrix\Broker\Service\BrokerService.exe
  register: citrix_broker_bin

- name: Block for Citrix installation
  block:

    - name: Install NuGet
      win_shell: Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force

    - name: Check for PendingReboot module
      win_psmodule:
        name: PendingReboot
        state: present
        accept_license: true
      retries: 3
      delay: 10
      register: result
      until: result is not failed

    # No NET-Framework-Core (.NET 3.5): its payload is in "Removed" state on
    # current Server images, so installing it reaches out to Windows Update
    # (error 0x8024402c when unreachable). Modern CVAD requires .NET 4.8,
    # which the 45 features below cover; 3.5 was only needed by 7.x-era
    # releases. Everything listed installs from the local component store.
    - name: Install Citrix Delivery Controller prerequisites
      win_feature:
        name:
          - NET-Framework-45-Core
          - NET-Framework-45-ASPNET
          - GPMC
          - RSAT-ADDS-Tools
          - RDS-Licensing-UI
          - WAS
          - Telnet-Client
          - GPMC
          - Remote-Assistance
          - RSAT-AD-Tools
          - Web-Server
          - Web-WebServer
          - Web-Common-Http
          - Web-Default-Doc
          - Web-Dir-Browsing
          - Web-Http-Errors
          - Web-Static-Content
          - Web-Http-Redirect
          - Web-Health
          - Web-Http-Logging
          - Web-Log-Libraries
          - Web-Http-Tracing
          - Web-Performance
          - Web-Stat-Compression
          - Web-Dyn-Compression
          - Web-Security
          - Web-Filtering
          - Web-Basic-Auth
          - Web-Windows-Auth
          - Web-Net-Ext45
          - Web-ASP
          - Web-ASP-Net45
          - Web-CGI
          - Web-ISAPI-Ext
          - Web-ISAPI-Filter
          - Web-Includes
          - Web-WebSockets
          - Web-Mgmt-Tools
          - Web-Mgmt-Console
          - Web-Mgmt-Compat
          - Web-Metabase
          - Web-Lgcy-Mgmt-Console
          - Web-Lgcy-Scripting
          - Web-WMI
          - Web-Scripting-Tools
        state: present
      register: win_feature

    - name: Reboot machine for Windows Features
      ansible.windows.win_reboot:
      when: win_feature.reboot_required

    - name: Create Log Folder
      win_file:
        path: C:\Logs
        state: directory

    - name: Create Download Folder
      win_file:
        path: C:\Download
        state: directory

    - name: Create Citrix Download Folder
      win_file:
        path: C:\Download\Citrix
        state: directory

    - name: Check if Citrix ISO is downloaded yet
      win_stat:
        path: "C:\\Download\\Citrix\\{{citrix.source}}"
      register: citrix_iso

    - name: Download Citrix ISO
      win_get_url:
        url: "{{ citrix.iso_url }}"
        dest: "C:\\Download\\Citrix\\{{citrix.source}}"
      when: citrix_iso.stat.exists == false

    - name: Register iso path
      set_fact:
        iso_path: "C:\\Download\\Citrix\\{{citrix.source}}"

    - name: Check for pending reboot
      win_shell: (Test-PendingReboot -SkipConfigurationManagerClientCheck).IsRebootPending
      register: pending_reboot

    - name: Set fact for pending reboot
      set_fact:
        pending_reboot: "{{ pending_reboot.stdout | trim | lower}}"

    - name: Reboot to remove the pending reboot
      ansible.windows.win_reboot:
      when: pending_reboot == true

    - name: Mount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out

    - name: Install Citrix Delivery Controller role
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\x64\\XenDesktop Setup\\XenDesktopServerSetup.exe"
        # desktopstudio was removed from XenDesktopServerSetup in CVAD 2507+:
        # Web Studio (webstudio) is the supported management console now.
        # Valid components: controller, webstudio, desktopdirector, licenseserver.
        arguments: /components webstudio,controller,desktopdirector /configure_firewall /nosql /noreboot /quiet /ignore_hw_check_failure /logpath C:\Logs
        state: present
        expected_return_code: [0, 3, 3010]
      register: citrix_installation

    - name: Unmount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: absent
      register: disk_image_out

    - name: Reboot to complete Citrix Delivery Controller installation
      ansible.windows.win_reboot:
      when: citrix_installation.reboot_required == true

    - name: Check for pending reboot
      win_shell: (Test-PendingReboot -SkipConfigurationManagerClientCheck).IsRebootPending
      register: pending_reboot

    - name: Set fact for pending reboot
      set_fact:
        pending_reboot: "{{ pending_reboot.stdout | trim | lower}}"

    - name: Reboot to remove the pending reboot
      ansible.windows.win_reboot:
      when: pending_reboot == true

    - name: Remove Citrix Delivery Controller RunOnce key from registry
      win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce
        name: "!XenDesktopSetup"
        state: absent
      register: install_resume

    - name: Mount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out

    - name: Resume the Citrix Delivery Controller installation
      win_package:
        path: C:\ProgramData\Citrix\XenDesktopSetup\XenDesktopServerSetup.exe
        state: present
        expected_return_code: [0, 3, 3010]
      when: install_resume.changed

    - name: Unmount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: absent

    - name: Check for pending reboot
      win_shell: (Test-PendingReboot -SkipConfigurationManagerClientCheck).IsRebootPending
      register: pending_reboot

    - name: Set fact for pending reboot
      set_fact:
        pending_reboot: "{{ pending_reboot.stdout | trim | lower}}"

    - name: Reboot to remove the pending reboot
      ansible.windows.win_reboot:
      when: pending_reboot == true

    - name: Verify Citrix Delivery Controller binaries are present
      win_stat:
        path: C:\Program Files\Citrix\Broker\Service\BrokerService.exe
      register: citrix_broker_installed
      failed_when: not citrix_broker_installed.stat.exists

    - name: Add registry for future installation check
      win_regedit:
        path: HKLM:\Software\GO-EUC\Citrix
        name: ddc_version
        data: "{{ citrix.version }}"
        type: string

  when: >
    (not citrix_broker_bin.stat.exists)
    or (citrix_version.exists == false)
    or (citrix_version.value != citrix.version)
