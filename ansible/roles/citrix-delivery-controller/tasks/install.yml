---
- name: Obtain information from registry for site check
  win_reg_stat:
    path: HKLM:\Software\GO-EUC\Citrix
    name: ddc_version
  register: citrix_version

# Do not trust the registry marker alone: XenDesktopServerSetup is multi-pass
# (reboot + RunOnce resume). A run can write ddc_version without BrokerService
# ever landing on disk.
- name: Check whether Citrix Delivery Controller is installed
  win_stat:
    path: C:\Program Files\Citrix\Broker\Service\BrokerService.exe
  register: citrix_broker_bin

- name: Block for Citrix installation
  block:

    # Clear any reboot left by earlier feature/MSI work before touching WinRM
    # for long-running tasks. Uses registry checks only - no NuGet/gallery.
    - name: Clear pending reboot before prerequisites
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-clear-pending-reboot.yml"
      vars:
        pending_reboot_check_name: Check for pending reboot before prerequisites
        pending_reboot_reboot_name: Reboot to clear pending reboot before prerequisites

    # Match the IIS/WAS feature set XenDesktopServerSetup enables via DISM so
    # the meta-installer does not run feature enablement (and reboot) itself.
    # Omit NetFx3 / NET-Framework-Core: FoD payload is Removed on Server 2022.
    # Split tools vs WAS/IIS: enabling WAS/IIS often restarts WinRM and shows up
    # as InvalidCredentialsError mid-task; the helper waits/retries through that.
    - name: Install Citrix Delivery Controller Windows features (tools)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-install-features.yml"
      vars:
        windows_feature_task_name: Install Citrix Delivery Controller Windows features (tools)
        windows_feature_names:
          - NET-Framework-45-Core
          - NET-Framework-45-ASPNET
          - NET-WCF-Services45
          - NET-WCF-HTTP-Activation45
          - GPMC
          - RSAT-ADDS-Tools
          - RSAT-AD-Tools
          - RDS-Licensing-UI
          - Remote-Assistance
          - Telnet-Client

    - name: Install Citrix Delivery Controller Windows features (IIS)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-install-features.yml"
      vars:
        windows_feature_task_name: Install Citrix Delivery Controller Windows features (IIS)
        windows_feature_names:
          - WAS
          - Web-Server
          - Web-WebServer
          - Web-Common-Http
          - Web-Default-Doc
          - Web-Dir-Browsing
          - Web-Http-Errors
          - Web-Static-Content
          - Web-Http-Redirect
          - Web-Health
          - Web-Http-Logging
          - Web-Log-Libraries
          - Web-Http-Tracing
          - Web-Performance
          - Web-Stat-Compression
          - Web-Dyn-Compression
          - Web-Security
          - Web-Filtering
          - Web-Basic-Auth
          - Web-Windows-Auth
          - Web-IP-Security
          - Web-App-Dev
          - Web-Net-Ext45
          - Web-ASP
          - Web-Asp-Net45
          - Web-CGI
          - Web-ISAPI-Ext
          - Web-ISAPI-Filter
          - Web-Includes
          - Web-WebSockets
          - Web-Mgmt-Tools
          - Web-Mgmt-Console
          - Web-Mgmt-Compat
          - Web-Metabase
          - Web-Lgcy-Mgmt-Console
          - Web-Lgcy-Scripting
          - Web-WMI
          - Web-Scripting-Tools

    - name: Create Log Folder
      win_file:
        path: C:\Logs
        state: directory

    - name: Create Download Folder
      win_file:
        path: C:\Download
        state: directory

    - name: Create Citrix Download Folder
      win_file:
        path: C:\Download\Citrix
        state: directory

    - name: Check if Citrix ISO is downloaded yet
      win_stat:
        path: "C:\\Download\\Citrix\\{{citrix.source}}"
      register: citrix_iso

    - name: Download Citrix ISO
      win_get_url:
        url: "{{ citrix.iso_url }}"
        dest: "C:\\Download\\Citrix\\{{citrix.source}}"
      when: citrix_iso.stat.exists == false

    - name: Register iso path
      set_fact:
        iso_path: "C:\\Download\\Citrix\\{{citrix.source}}"

    - name: Mount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out

    # Pre-install Support\* packages the meta-installer would otherwise install
    # mid-run (VC++, URL Rewrite, ARR, SqlLocalDB). Nested msiexec under
    # XenDesktopServerSetup is what fails with MSI 1719/1603 on SqlLocalDB
    # (custom-action server dies) and then leaves a pending reboot / dead WinRM.
    - name: Ensure Windows Installer service is running
      win_service:
        name: msiserver
        state: started
        start_mode: manual

    - name: Pre-install Visual C++ x64 runtime from Citrix media
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\Support\\VcRedist\\vc_redist.x64.exe"
        arguments: /quiet /norestart
        state: present
        expected_return_code: [0, 1638, 3010]

    - name: Pre-install Visual C++ x86 runtime from Citrix media
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\Support\\VcRedist\\vc_redist.x86.exe"
        arguments: /quiet /norestart
        state: present
        expected_return_code: [0, 1638, 3010]

    - name: Pre-install IIS URL Rewrite from Citrix media
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\Support\\UrlRewrite\\rewrite_amd64_en-US.msi"
        arguments: /qn REBOOT=ReallySuppress
        state: present
        expected_return_code: [0, 1638, 3010]

    - name: Pre-install Application Request Routing from Citrix media
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\Support\\ApplicationRequestRouter\\requestRouter_amd64.msi"
        arguments: /qn REBOOT=ReallySuppress
        state: present
        expected_return_code: [0, 1638, 3010]

    - name: Check whether SQL LocalDB is already installed
      win_stat:
        path: C:\Program Files\Microsoft SQL Server\160\Tools\Binn\SqlLocalDB.exe
      register: sqllocaldb_bin

    # Use msiexec directly (not nested under the meta-installer). A prior nested
    # Citrix install can leave product {5148FDBB-...} half-registered after 1719
    # rollback — uninstall that residue before installing cleanly.
    - name: Pre-install SQL LocalDB from Citrix media
      win_shell: |
        $ErrorActionPreference = 'Stop'
        $productCode = '{5148FDBB-2CFC-4953-B5E5-E44E361BAFD4}'
        $bin = 'C:\Program Files\Microsoft SQL Server\160\Tools\Binn\SqlLocalDB.exe'
        $msi = '{{ disk_image_out.mount_paths[0] }}\Support\SQLLocalDB\SqlLocalDB.msi'
        $log = 'C:\Logs\SqlLocalDB-preinstall.log'

        if (Test-Path $bin) { exit 0 }

        # Clear dirty product registration from a previous failed nested install.
        $uninst = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$productCode" -ErrorAction SilentlyContinue
        if (-not $uninst) {
          $uninst = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\$productCode" -ErrorAction SilentlyContinue
        }
        if ($uninst) {
          Write-Host "Removing leftover SqlLocalDB product $productCode"
          $x = Start-Process -FilePath msiexec.exe -ArgumentList @(
            '/x', $productCode, '/qn', 'REBOOT=ReallySuppress'
          ) -Wait -PassThru
          Start-Sleep -Seconds 5
        }

        $p = Start-Process -FilePath msiexec.exe -ArgumentList @(
          '/i', "`"$msi`"",
          '/qn',
          'IACCEPTSQLLOCALDBLICENSETERMS=YES',
          'REBOOT=ReallySuppress',
          '/L*v', "`"$log`""
        ) -Wait -PassThru
        # 0 = success, 1638 = already installed, 3010 = success reboot required
        if ($p.ExitCode -in @(0, 1638, 3010)) { exit 0 }
        Write-Error "SqlLocalDB msiexec failed with exit code $($p.ExitCode). See $log"
        exit $p.ExitCode
      args:
        executable: powershell
      register: sqllocaldb_install
      retries: 3
      delay: 45
      until: sqllocaldb_install.rc == 0
      when: not sqllocaldb_bin.stat.exists
      vars:
        ansible_winrm_operation_timeout_sec: 3600
        ansible_winrm_read_timeout_sec: 3700

    - name: Verify SQL LocalDB binaries are present
      win_stat:
        path: C:\Program Files\Microsoft SQL Server\160\Tools\Binn\SqlLocalDB.exe
      register: sqllocaldb_installed
      failed_when: not sqllocaldb_installed.stat.exists

    # SqlLocalDB/VC++ often leave MSI in a dirty state without setting the
    # usual pending-reboot registry keys. Always reboot so Web Studio's IIS
    # custom actions do not hit Error 1719 (msiserver inaccessible).
    - name: Reboot after media prerequisites to settle MSI state
      ansible.windows.win_reboot:
        reboot_timeout: 3600

    # ISO mount is lost across the prereq reboot above.
    - name: Remount the Citrix installation ISO for meta-installer
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out

    - name: Discover remaining Support packages on Citrix media
      win_shell: |
        $root = '{{ disk_image_out.mount_paths[0] }}'
        $find = {
          param($patterns)
          foreach ($p in $patterns) {
            $hit = Get-ChildItem -Path $root -Recurse -Filter $p -File -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($hit) { return $hit }
          }
          return ''
        }
        [pscustomobject]@{
          webview2 = & $find @('*WebView2*.exe', '*MicrosoftEdgeWebView2RuntimeInstaller*.exe')
          desktop_runtime_x86 = & $find @('windowsdesktop-runtime*win-x86.exe', '*DesktopRuntime*x86*.exe')
          desktop_runtime_x64 = & $find @('windowsdesktop-runtime*win-x64.exe', '*DesktopRuntime*x64*.exe')
          webstudio = (Join-Path $root 'x64\DesktopStudio\WebStudio_x64.msi')
        } | ConvertTo-Json -Compress
      args:
        executable: powershell
      register: citrix_media_packages
      changed_when: false

    - name: Parse discovered Citrix media package paths
      ansible.builtin.set_fact:
        citrix_media_pkg: "{{ citrix_media_packages.stdout | from_json }}"

    - name: Pre-install Edge WebView2 from Citrix media
      win_package:
        path: "{{ citrix_media_pkg.webview2 }}"
        arguments: /silent /install
        state: present
        expected_return_code: [0, 1638, 3010]
      when: citrix_media_pkg.webview2 | length > 0

    - name: Pre-install .NET Desktop Runtime x86 from Citrix media
      win_package:
        path: "{{ citrix_media_pkg.desktop_runtime_x86 }}"
        arguments: /install /quiet /norestart
        state: present
        expected_return_code: [0, 1638, 3010]
      when: citrix_media_pkg.desktop_runtime_x86 | length > 0

    - name: Pre-install .NET Desktop Runtime x64 from Citrix media
      win_package:
        path: "{{ citrix_media_pkg.desktop_runtime_x64 }}"
        arguments: /install /quiet /norestart
        state: present
        expected_return_code: [0, 1638, 3010]
      when: citrix_media_pkg.desktop_runtime_x64 | length > 0

    # Web Studio's deferred StartIIS7ConfigTransaction CA dies with 1719 when
    # nested under XenDesktopServerSetup while IIS/WAS are live. Install the
    # MSI standalone with IIS stopped so the meta-installer can skip it.
    - name: Stop IIS before standalone Web Studio install
      win_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - W3SVC
        - WAS
      failed_when: false

    - name: Ensure Windows Installer service is running before Web Studio
      win_service:
        name: msiserver
        state: started
        start_mode: manual

    - name: Pre-install Web Studio from Citrix media
      win_shell: |
        $ErrorActionPreference = 'Stop'
        $msi = '{{ citrix_media_pkg.webstudio }}'
        $log = 'C:\Logs\WebStudio-preinstall.log'
        $productCode = '{CC2CF8E9-E9A4-445A-8D32-FA0537DDECE9}'
        if (-not (Test-Path $msi)) {
          Write-Error "Web Studio MSI not found at $msi"
          exit 1
        }
        $marker = 'C:\Program Files\Citrix\Web Studio'
        if (Test-Path $marker) { exit 0 }

        # Clear dirty product registration left by a previous 1719 rollback.
        $uninst = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$productCode" -ErrorAction SilentlyContinue
        if (-not $uninst) {
          $uninst = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\$productCode" -ErrorAction SilentlyContinue
        }
        if ($uninst) {
          Write-Host "Removing leftover Web Studio product $productCode"
          Start-Process -FilePath msiexec.exe -ArgumentList @(
            '/x', $productCode, '/qn', 'REBOOT=ReallySuppress'
          ) -Wait -PassThru | Out-Null
          Start-Sleep -Seconds 5
        }

        $p = Start-Process -FilePath msiexec.exe -ArgumentList @(
          '/i', "`"$msi`"",
          '/qn',
          'REBOOT=ReallySuppress',
          'INSTALLLOCATION=C:\Program Files\Citrix',
          'ARPSYSTEMCOMPONENT=1',
          '/L*v', "`"$log`""
        ) -Wait -PassThru
        if ($p.ExitCode -in @(0, 1638, 3010)) { exit 0 }
        Write-Error "Web Studio msiexec failed with exit code $($p.ExitCode). See $log"
        exit $p.ExitCode
      args:
        executable: powershell
      register: webstudio_install
      retries: 2
      delay: 30
      until: webstudio_install.rc == 0
      when: citrix_media_pkg.webstudio | length > 0
      vars:
        ansible_winrm_operation_timeout_sec: 3600
        ansible_winrm_read_timeout_sec: 3700

    - name: Start IIS after standalone Web Studio install
      win_service:
        name: "{{ item }}"
        state: started
      loop:
        - WAS
        - W3SVC
      failed_when: false

    - name: Clear pending reboot after Web Studio pre-install
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-clear-pending-reboot.yml"
      vars:
        pending_reboot_check_name: Check for pending reboot after Web Studio pre-install
        pending_reboot_reboot_name: Reboot to clear pending reboot after Web Studio pre-install

    - name: Remount the Citrix installation ISO after Web Studio pre-install
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out

    - name: Install Citrix Delivery Controller role
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\x64\\XenDesktop Setup\\XenDesktopServerSetup.exe"
        # desktopstudio was removed from XenDesktopServerSetup in CVAD 2507+:
        # Web Studio (webstudio) is the supported management console now.
        # Valid components: controller, webstudio, desktopdirector, licenseserver.
        arguments: /components webstudio,controller,desktopdirector /configure_firewall /nosql /noreboot /quiet /ignore_hw_check_failure /logpath C:\Logs
        state: present
        expected_return_code: [0, 3, 3010]
      register: citrix_installation
      # WinRM HTTP 400 / credential rejection during MSI work is reported as
      # failed, not unreachable — ignore both and recover below.
      ignore_unreachable: true
      ignore_errors: true
      vars:
        ansible_winrm_operation_timeout_sec: 7200
        ansible_winrm_read_timeout_sec: 7300

    - name: Remember whether Citrix meta-installer needs recovery
      ansible.builtin.set_fact:
        citrix_install_needs_recovery: "{{ citrix_installation is failed or citrix_installation is unreachable }}"

    # The meta-installer can still reboot / kill WinRM even with /noreboot.
    - name: Wait for WinRM after installer disruption
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15
        delay: 45
      when: citrix_install_needs_recovery | bool

    - name: Unmount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: absent
      register: disk_image_out
      ignore_unreachable: true
      ignore_errors: true

    - name: Reboot to complete Citrix Delivery Controller installation
      ansible.windows.win_reboot:
        reboot_timeout: 3600
      when:
        - not (citrix_install_needs_recovery | bool)
        - citrix_installation.reboot_required | default(false)

    - name: Clear pending reboot after Citrix install
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-clear-pending-reboot.yml"
      vars:
        pending_reboot_check_name: Check for pending reboot after Citrix install
        pending_reboot_reboot_name: Reboot to clear pending reboot after Citrix install

    - name: Remove Citrix Delivery Controller RunOnce key from registry
      win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce
        name: "!XenDesktopSetup"
        state: absent
      register: install_resume

    - name: Check for copied meta-installer resume binary
      win_stat:
        path: C:\ProgramData\Citrix\XenDesktopSetup\XenDesktopServerSetup.exe
      register: citrix_resume_bin

    - name: Mount the Citrix installation ISO for resume
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out
      when: install_resume.changed or citrix_resume_bin.stat.exists

    - name: Resume the Citrix Delivery Controller installation
      win_package:
        path: C:\ProgramData\Citrix\XenDesktopSetup\XenDesktopServerSetup.exe
        state: present
        expected_return_code: [0, 3, 3010]
      register: citrix_resume
      ignore_unreachable: true
      ignore_errors: true
      when: install_resume.changed or (citrix_install_needs_recovery | bool and citrix_resume_bin.stat.exists)
      vars:
        ansible_winrm_operation_timeout_sec: 7200
        ansible_winrm_read_timeout_sec: 7300

    - name: Wait for WinRM after resume disruption
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15
        delay: 45
      when:
        - citrix_resume is defined
        - citrix_resume is failed or citrix_resume is unreachable

    - name: Remount the Citrix installation ISO for meta-installer retry
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out
      when:
        - citrix_install_needs_recovery | bool
        - not citrix_resume_bin.stat.exists

    - name: Retry Citrix Delivery Controller role after recovery
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\x64\\XenDesktop Setup\\XenDesktopServerSetup.exe"
        arguments: /components webstudio,controller,desktopdirector /configure_firewall /nosql /noreboot /quiet /ignore_hw_check_failure /logpath C:\Logs
        state: present
        expected_return_code: [0, 3, 3010]
      register: citrix_installation_retry
      when:
        - citrix_install_needs_recovery | bool
        - not citrix_resume_bin.stat.exists
      vars:
        ansible_winrm_operation_timeout_sec: 7200
        ansible_winrm_read_timeout_sec: 7300

    - name: Unmount the Citrix installation ISO after resume
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: absent
      when: install_resume.changed or citrix_resume_bin.stat.exists or (citrix_install_needs_recovery | bool)

    - name: Clear pending reboot after Citrix resume
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-clear-pending-reboot.yml"
      vars:
        pending_reboot_check_name: Check for pending reboot after Citrix resume
        pending_reboot_reboot_name: Reboot to clear pending reboot after Citrix resume

    - name: Verify Citrix Delivery Controller binaries are present
      win_stat:
        path: C:\Program Files\Citrix\Broker\Service\BrokerService.exe
      register: citrix_broker_installed
      failed_when: not citrix_broker_installed.stat.exists

    - name: Add registry for future installation check
      win_regedit:
        path: HKLM:\Software\GO-EUC\Citrix
        name: ddc_version
        data: "{{ citrix.version }}"
        type: string

  when: >
    (not citrix_broker_bin.stat.exists)
    or (citrix_version.exists == false)
    or (citrix_version.value != citrix.version)
