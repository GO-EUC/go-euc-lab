---

- name: Create Citrix Site
  citrix_site:
    name: "{{ citrix.site }}"
    db_server: "{{ groups['sql'][0] }}"
    db_port: "{{ citrix.database_port }}"
    admin_group: "{{ dns_domain_name }}\\{{ citrix.admin }}"
    state: present
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ ansible_user }}"
    ansible_become_password: "{{ ansible_password }}"

- name: Set the Citrix License Server
  citrix_license:
    lic_server: "{{ groups['citrix_lic'][0] }}"
    lic_port: 27000
    lic_model: UserDevice
    lic_product_code: XDT
    lic_product_edition: PLT
    state: present
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ ansible_user }}"
    ansible_become_password: "{{ ansible_password }}"

- name: Set vSphere hypervisor connection
  citrix_hosting_connection:
    name: Default
    type: vSphere
    host_address: "{{ vmware.vsphere.host }}"
    host_username: "{{ vmware.vsphere.username }}"
    host_password: "{{ vsphere_password }}"
    host_datacenter: GO
    host_cluster: Infra
    host_storage: datastore2
    host_network: VM Network
    state: present
  when: go_euc_platform | default('vmware') == 'vmware'
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ ansible_user }}"
    ansible_become_password: "{{ ansible_password }}"

- name: Set Nutanix AHV hypervisor connection
  citrix_hosting_connection:
    name: Default
    type: Nutanix
    host_address: "{{ nutanix_host }}"
    host_username: "{{ nutanix_username }}"
    host_password: "{{ nutanix_password }}"
    host_cluster: "{{ nutanix_cluster_name }}"
    host_storage: "{{ nutanix_storage_name }}"
    host_network: "{{ nutanix_network_name }}"
    state: present
  when: go_euc_platform | default('vmware') == 'nutanix'
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ ansible_user }}"
    ansible_become_password: "{{ ansible_password }}"