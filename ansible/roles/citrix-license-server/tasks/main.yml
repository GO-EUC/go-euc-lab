---
- name: Obtain information from registry for site check
  win_reg_stat:
    path: HKLM:\Software\GO-EUC\Citrix
    name: lic_version
  register: citrix_version

# Do not trust the registry marker alone: a failed or partial run can leave
# lic_version set without CTX_Licensing.msi having been installed.
- name: Check whether Citrix License Server is installed
  win_stat:
    path: C:\Program Files (x86)\Citrix\Licensing\LS\lmgrd.exe
  register: citrix_licensing_bin

- name: Block for Citrix installation
  block:

    - name: Install NuGet
      win_shell: Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force

    - name: Check for PendingReboot module
      win_psmodule:
        name: PendingReboot
        state: present
        accept_license: true
      retries: 3
      delay: 10
      register: result
      until: result is not failed

    # No NET-Framework-Core/-Features (.NET 3.5): the payload is in "Removed"
    # state on current Server images, so installing it reaches out to Windows
    # Update (error 0x8024402c when unreachable). The license server needs
    # .NET 4.x, covered by the 45 features, which install from the local
    # component store.
    - name: Install Citrix License Server prerequisites
      win_feature:
        name:
          - NET-Framework-45-Features
          - NET-Framework-45-Core
          - NET-Framework-45-ASPNET
        state: present
      register: win_feature

    - name: Reboot machine for Windows Features
      ansible.windows.win_reboot:
      when: win_feature.reboot_required

    - name: Create Log Folder
      win_file:
        path: C:\Logs
        state: directory

    - name: Create Download Folder
      win_file:
        path: C:\Download
        state: directory

    - name: Create Citrix Download Folder
      win_file:
        path: C:\Download\Citrix
        state: directory

    - name: Check if Citrix ISO is downloaded yet
      win_stat:
        path: "C:\\Download\\Citrix\\{{citrix.source}}"
      register: citrix_iso

    - name: Download Citrix ISO
      win_get_url:
        url: "{{ citrix.iso_url }}"
        dest: "C:\\Download\\Citrix\\{{citrix.source}}"
      when: citrix_iso.stat.exists == false

    - name: Register iso path
      set_fact:
        iso_path: "C:\\Download\\Citrix\\{{citrix.source}}"

    # stdout is the string "True"/"False"; comparing to boolean true skipped
    # the reboot and let Windows reboot mid-install instead.
    - name: Check for pending reboot before install
      win_shell: (Test-PendingReboot -SkipConfigurationManagerClientCheck).IsRebootPending
      register: pending_reboot_check

    - name: Reboot to clear pending reboot before install
      ansible.windows.win_reboot:
        reboot_timeout: 3600
      when: (pending_reboot_check.stdout | trim | lower) == 'true'

    - name: Mount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out

    - name: Install Citrix License Server role
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\x64\\Licensing\\CTX_Licensing.msi"
        state: present
      register: lic_install
      ignore_unreachable: true
      vars:
        ansible_winrm_operation_timeout_sec: 3600
        ansible_winrm_read_timeout_sec: 3700

    - name: Wait for WinRM after installer reboot
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15
        delay: 30
      when: lic_install is unreachable

    - name: Install Citrix License PowerShell snap-ins
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\x64\\Licensing\\LicensingAdmin_PowerShellSnapin_x64.msi"
        arguments: "REINSTALL=ALL REINSTALLMODE=A"
        state: present
      ignore_errors: true

    - name: Open firewall port for Citrix License Server
      community.windows.win_firewall_rule:
        name: Citrix License Server
        localport: "{{citrix.licensing.port}}"
        action: allow
        direction: in
        protocol: tcp
        profiles: [domain, private]
        state: present
        enabled: true

    - name: Reboot to complete installation
      ansible.windows.win_reboot:
        reboot_timeout: 3600
      when:
        - lic_install is not unreachable
        - lic_install.changed | default(false)

    - name: Verify Citrix License Server is present
      win_stat:
        path: C:\Program Files (x86)\Citrix\Licensing\LS\lmgrd.exe
      register: citrix_licensing_installed
      failed_when: not citrix_licensing_installed.stat.exists

    - name: Add registry for future installation check
      win_regedit:
        path: HKLM:\Software\GO-EUC\Citrix
        name: lic_version
        data: "{{ citrix.version }}"
        type: string

  when: >
    (not citrix_licensing_bin.stat.exists)
    or (citrix_version.exists == false)
    or (citrix_version.value != citrix.version)
