---
# Timezone and DNS must run even when the machine is already a domain member:
# the join itself is skipped on re-runs, but DNS can drift back to the
# guest-customization defaults, and domain credentials then fail WinRM
# ("the specified credentials were rejected") while the local build account
# still works.

# Citrix/feature installs often leave a pending reboot. Continuing while one
# is queued lets Windows reboot mid-task (empty "ntlm:" / WinRM HTTP 400).
- name: Clear pending reboot before domain configuration
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-clear-pending-reboot.yml"
  vars:
    pending_reboot_check_name: Check for pending reboot before domain configuration
    pending_reboot_reboot_name: Reboot to clear pending reboot before domain configuration

- name: "Set timezone to '{{ windows_timezone }}'"
  win_timezone:
    timezone: "{{ windows_timezone }}"
  register: timezone_result
  until: timezone_result is not unreachable
  retries: 10
  delay: 30
  ignore_unreachable: true

- name: Set fact for Domain Path
  set_fact:
    domain_path: "DC={{ dns_domain_name.split('.') | join(',DC=') }}"

- name: Set DNS to primary domain controller
  win_dns_client:
    adapter_names: '*'
    ipv4_addresses:
      - "{{ hostvars[groups['dc'][0]].ansible_host }}"
  register: dns_result
  until: dns_result is not unreachable and dns_result is not failed
  retries: 10
  delay: 30
  ignore_unreachable: true

- name: Wait for WinRM after DNS change if the host rebooted
  ansible.builtin.wait_for_connection:
    timeout: 1800
    sleep: 15
    delay: 30
  when: dns_result is unreachable

- name: Flush DNS cache after pointing at the domain controller
  win_shell: Clear-DnsClientCache
  register: flush_result
  until: flush_result is not unreachable
  retries: 10
  delay: 30
  ignore_unreachable: true

- name: Domain join machine
  block:

  - name: Domain join
    win_domain_membership:
      dns_domain_name: "{{ dns_domain_name }}"
      hostname: "{{ inventory_hostname }}"
      domain_admin_user: "{{ domain_admin_user }}"
      domain_admin_password: "{{ domain_password }}"
      domain_ou_path: "{{ ou_path }},{{ domain_path }}"
      state: domain
    register: domain_state
    retries: 2
    delay: 30
    until: domain_state is not failed

  - name: Reboot to complete domain join
    win_reboot:
      reboot_timeout: 3600
    when: domain_state.reboot_required

  when: ansible_facts['windows_domain_member'] == false
