---
# Timezone and DNS must run even when the machine is already a domain member:
# the join itself is skipped on re-runs, but DNS can drift back to the
# guest-customization defaults, and domain credentials then fail WinRM
# ("the specified credentials were rejected") while the local build account
# still works.

- name: "Set timezone to '{{ windows_timezone }}'"
  win_timezone:
    timezone: "{{ windows_timezone }}"

- name: Set fact for Domain Path
  set_fact:
    domain_path: "DC={{ dns_domain_name.split('.') | join(',DC=') }}"

- name: Set DNS to primary domain controller
  win_dns_client:
    adapter_names: '*'
    ipv4_addresses:
      - "{{ hostvars[groups['dc'][0]].ansible_host }}"

- name: Flush DNS cache after pointing at the domain controller
  win_shell: Clear-DnsClientCache

- name: Domain join machine
  block:

  - name: Domain join
    win_domain_membership:
      dns_domain_name: "{{ dns_domain_name }}"
      hostname: "{{ inventory_hostname }}"
      domain_admin_user: "{{ domain_admin_user }}"
      domain_admin_password: "{{ domain_password }}"
      domain_ou_path: "{{ ou_path }},{{ domain_path }}"
      state: domain
    register: domain_state
    retries: 2
    delay: 30
    until: domain_state is not failed

  - name: Reboot to complete domain join
    win_reboot:
    when: domain_state.reboot_required

  when: ansible_facts['windows_domain_member'] == false
