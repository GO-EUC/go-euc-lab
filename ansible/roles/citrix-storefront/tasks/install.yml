---
- name: Obtain information from registry for site check
  win_reg_stat:
    path: HKLM:\Software\GO-EUC\Citrix
    name: sf_version
  register: citrix_version

- name: Check whether Citrix StoreFront is installed
  win_stat:
    path: C:\Program Files\Citrix\Receiver StoreFront\Services
  register: citrix_storefront_dir

- name: Block for Citrix installation
  block:

    - name: Clear pending reboot before prerequisites
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-clear-pending-reboot.yml"
      vars:
        pending_reboot_check_name: Check for pending reboot before prerequisites
        pending_reboot_reboot_name: Reboot to clear pending reboot before prerequisites

    # No NET-Framework-Features (.NET 3.5): payload is "Removed" on current
    # Server images and forces a Windows Update download.
    - name: Install Citrix Storefront prerequisites
      win_feature:
        name:
          - Web-Server
          - Web-WebServer
          - Web-Common-Http
          - Web-Default-Doc
          - Web-Dir-Browsing
          - Web-Http-Errors
          - Web-Static-Content
          - Web-Http-Redirect
          - Web-Health
          - Web-Http-Logging
          - Web-Log-Libraries
          - Web-Http-Tracing
          - Web-Performance
          - Web-Stat-Compression
          - Web-Dyn-Compression
          - Web-Security
          - Web-Filtering
          - Web-Basic-Auth
          - Web-Windows-Auth
          - Web-App-Dev
          - Web-Net-Ext45
          - Web-AppInit
          - Web-ASP
          - Web-Asp-Net45
          - Web-CGI
          - Web-ISAPI-Ext
          - Web-ISAPI-Filter
          - Web-Includes
          - Web-Mgmt-Tools
          - Web-Mgmt-Console
          - Web-Mgmt-Compat
          - Web-Metabase
          - Web-Lgcy-Mgmt-Console
          - Web-Lgcy-Scripting
          - Web-WMI
          - Web-Scripting-Tools
          - NET-Framework-45-Features
          - NET-Framework-45-Core
          - NET-Framework-45-ASPNET
          - NET-WCF-Services45
          - NET-WCF-HTTP-Activation45
          - NET-WCF-TCP-PortSharing45
          - WAS
          - Telnet-Client
        state: present
      register: win_feature

    - name: Reboot machine for Windows Features
      ansible.windows.win_reboot:
      when: win_feature.reboot_required

    - name: Create Log Folder
      win_file:
        path: C:\Logs
        state: directory

    - name: Create Download Folder
      win_file:
        path: C:\Download
        state: directory

    - name: Create Citrix Download Folder
      win_file:
        path: C:\Download\Citrix
        state: directory

    - name: Check if Citrix ISO is downloaded yet
      win_stat:
        path: "C:\\Download\\Citrix\\{{citrix.source}}"
      register: citrix_iso

    - name: Download Citrix ISO
      win_get_url:
        url: "{{ citrix.iso_url }}"
        dest: "C:\\Download\\Citrix\\{{citrix.source}}"
      when: citrix_iso.stat.exists == false

    - name: Register iso path
      set_fact:
        iso_path: "C:\\Download\\Citrix\\{{citrix.source}}"

    - name: Clear pending reboot before Citrix install
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/windows-clear-pending-reboot.yml"
      vars:
        pending_reboot_check_name: Check for pending reboot before Citrix install
        pending_reboot_reboot_name: Reboot to clear pending reboot before Citrix install

    - name: Mount the Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: present
      register: disk_image_out

    - name: Install Citrix Storefront role
      win_package:
        path: "{{ disk_image_out.mount_paths[0] }}\\x64\\Storefront\\CitrixStoreFront-x64.exe"
        arguments: -silent
        state: present
        expected_return_code: [0, 3, 3010]
      register: citrix_installation
      ignore_unreachable: true
      vars:
        ansible_winrm_operation_timeout_sec: 3600
        ansible_winrm_read_timeout_sec: 3700

    - name: Wait for WinRM after installer reboot
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 15
        delay: 30
      when: citrix_installation is unreachable

    - name: Unmount Citrix installation ISO
      win_disk_image:
        image_path: "{{ iso_path }}"
        state: absent

    - name: Reboot to complete Citrix Storefront installation
      ansible.windows.win_reboot:
        reboot_timeout: 3600
      when:
        - citrix_installation is not unreachable
        - citrix_installation.changed | default(false)

    - name: Verify Citrix StoreFront is present
      win_stat:
        path: C:\Program Files\Citrix\Receiver StoreFront\Services
      register: citrix_storefront_installed
      failed_when: not citrix_storefront_installed.stat.exists

    - name: Add registry for future installation check
      win_regedit:
        path: HKLM:\Software\GO-EUC\Citrix
        name: sf_version
        data: "{{ citrix.version }}"
        type: string

  when: >
    (not citrix_storefront_dir.stat.exists)
    or (citrix_version.exists == false)
    or (citrix_version.value != citrix.version)
