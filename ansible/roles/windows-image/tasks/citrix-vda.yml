---
- name: Set fact for Workstation
  set_fact:
    citrix_type: Workstation
  when: ansible_facts.os_installation_type == 'Client'

- name: Set fact for Server
  set_fact:
    citrix_type: Server
  when: ansible_facts.os_installation_type == 'Server'

- name: Create Temp folder
  win_file:
    path: C:\Temp
    state: directory

- name: Report the Citrix VDA installer URL
  debug:
    msg: "{{ (citrix_type == 'Workstation') | ternary(citrix.vda_workstation_url, citrix.vda_server_url) }}"

- name: Download Citrix {{ citrix_type }} VDA
  win_get_url:
    url: "{{ (citrix_type == 'Workstation') | ternary(citrix.vda_workstation_url, citrix.vda_server_url) }}"
    dest: C:\Temp\VDASetup.exe
    timeout: 7200
  vars:
    ansible_winrm_operation_timeout_sec: 7200
    ansible_winrm_read_timeout_sec: 7300

- name: Install Microsoft Visual C++ Redistributable Latest - X86"
  win_package:
    path: https://aka.ms/vs/17/release/vc_redist.x86.exe
    arguments: /q /norestart

- name: Install Microsoft Visual C++ Redistributable Latest - X64"
  win_package:
    path: https://aka.ms/vs/17/release/vc_redist.x64.exe
    arguments: /q /norestart

- name: Install Microsoft .NET Framework 4.8 - Offline installer
  win_package:
    path: https://go.microsoft.com/fwlink/?linkid=2088631
    arguments: /q /norestart

# win_package waits for VDASetup.exe to exit. After RDS is enabled the
# meta-installer writes ExitCode 3 and RunOnce, then the wrapper stays
# alive so Ansible never reboots. Poll Citrix MetaInstall instead.
- name: Read Citrix VDA meta-install exit code
  win_reg_stat:
    path: HKLM:\SOFTWARE\Citrix\MetaInstall
    name: ExitCode
  register: vda_meta_exit

- name: Stop leftover VDA setup processes
  win_shell: |
    Get-Process -Name VDASetup, XenDesktopVdaSetup, XenDesktopRemotePCSetup, XenDesktopSingleSessionCoreSetup -ErrorAction SilentlyContinue |
      Stop-Process -Force
  failed_when: false

- name: Set VDA setup arguments
  set_fact:
    vda_setup_args: /components VDA /disableexperiencemetrics /enable_hdx_ports /enable_hdx_udp_ports /enable_real_time_transport /masterimage /noreboot /quiet
    vda_needs_second_pass: "{{ vda_meta_exit.exists | default(false) and (vda_meta_exit.value | string) in ['3', '3010'] }}"

- name: Install Citrix {{ citrix_type }} VDA
  win_shell: |
    $setup = "C:\Temp\VDASetup.exe"
    $args = "{{ vda_setup_args }}"
    $deadline = (Get-Date).AddMinutes(40)
    $proc = Start-Process -FilePath $setup -ArgumentList $args -PassThru
    do {
      Start-Sleep -Seconds 20
      $exit = $null
      try {
        $exit = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Citrix\MetaInstall" -ErrorAction Stop).ExitCode
      } catch { }
      if ($null -ne $exit -and $exit -in 0, 3, 3010) {
        Get-Process -Name VDASetup, XenDesktopVdaSetup, XenDesktopRemotePCSetup, XenDesktopSingleSessionCoreSetup -ErrorAction SilentlyContinue |
          Stop-Process -Force
        exit [int]$exit
      }
      if ($proc.HasExited -and $proc.ExitCode -in 0, 3, 3010) {
        exit [int]$proc.ExitCode
      }
    } while ((Get-Date) -lt $deadline)
    Get-Process -Name VDASetup, XenDesktopVdaSetup -ErrorAction SilentlyContinue | Stop-Process -Force
    throw "VDA setup did not record MetaInstall ExitCode 0/3/3010 within 40 minutes"
  register: install
  failed_when: install.rc not in [0, 3, 3010]
  when: not (vda_needs_second_pass | bool)
  vars:
    ansible_winrm_operation_timeout_sec: 7200
    ansible_winrm_read_timeout_sec: 7300

- name: Remember that a VDA reboot pass is required
  set_fact:
    vda_needs_second_pass: true
  when:
    - not (vda_needs_second_pass | bool)
    - install.rc | default(0) in [3, 3010]

- name: Remove Citrix VDA RunOnce resume key
  win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce
    name: "!XenDesktopSetup"
    state: absent
  when: vda_needs_second_pass | bool

- name: Reboot VDA during install
  win_reboot:
    reboot_timeout: 3600
  when: vda_needs_second_pass | bool

- name: Wait for WinRM after VDA reboot
  wait_for_connection:
    timeout: 1800
    sleep: 15
    delay: 30
  when: vda_needs_second_pass | bool

- name: Second install Citrix {{ citrix_type }} VDA
  win_shell: |
    $setup = "C:\Temp\VDASetup.exe"
    $resume = "C:\ProgramData\Citrix\XenDesktopSetup\XenDesktopVdaSetup.exe"
    if (Test-Path $resume) { $setup = $resume }
    $args = "{{ vda_setup_args }}"
    $deadline = (Get-Date).AddMinutes(40)
    $proc = Start-Process -FilePath $setup -ArgumentList $args -PassThru
    do {
      Start-Sleep -Seconds 20
      $exit = $null
      try {
        $exit = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Citrix\MetaInstall" -ErrorAction Stop).ExitCode
      } catch { }
      # Pass 2 overwrites ExitCode; treat a new 0 as success. A leftover 3
      # from pass 1 is ignored until the process exits or ExitCode changes
      # after this process started.
      if ($null -ne $exit -and $exit -eq 0) {
        Get-Process -Name VDASetup, XenDesktopVdaSetup, XenDesktopRemotePCSetup, XenDesktopSingleSessionCoreSetup -ErrorAction SilentlyContinue |
          Stop-Process -Force
        exit 0
      }
      if ($proc.HasExited -and $proc.ExitCode -in 0, 3, 3010) {
        exit [int]$proc.ExitCode
      }
      if ($null -ne $exit -and $exit -in 3, 3010 -and $proc.HasExited) {
        exit [int]$exit
      }
    } while ((Get-Date) -lt $deadline)
    Get-Process -Name VDASetup, XenDesktopVdaSetup -ErrorAction SilentlyContinue | Stop-Process -Force
    throw "VDA resume did not finish within 40 minutes"
  register: install
  failed_when: install.rc not in [0, 3, 3010]
  when: vda_needs_second_pass | bool
  vars:
    ansible_winrm_operation_timeout_sec: 7200
    ansible_winrm_read_timeout_sec: 7300

- name: Reboot after VDA
  win_reboot:
    reboot_timeout: 3600
  when: install.rc | default(0) in [3, 3010] or install.reboot_required | default(false)
