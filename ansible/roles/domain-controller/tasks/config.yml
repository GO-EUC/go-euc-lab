---
- name: Set fact
  set_fact:
    domain_path: "DC={{ dns_domain_name.split('.') | join(',DC=') }}"

- name: Check for ActiveDirectory DSC Powershell module
  win_psmodule:
    name: ActiveDirectoryDsc
    state: present
  retries: 5

- name: Create OU
  win_dsc:
    resource_name: ADOrganizationalUnit
    name: GO
    path: "{{ domain_path }}"

- name: Create OU
  win_dsc:
    resource_name: ADOrganizationalUnit
    name: "{{ item }}"
    path: "OU=GO,{{ domain_path }}"
  loop:
    - Accounts
    - Groups
    - LoadGen
    - ServiceAccounts
    - Machines

- name: Create OU
  win_dsc:
    resource_name: ADOrganizationalUnit
    name: "{{ item }}"
    path: "OU=Machines,OU=GO,{{ domain_path }}"
  loop:
    - Bots
    - Builds
    - GPU
    - Infra
    - RDS
    - VDI

- name: Ensure the group LoadGen exists using sAMAccountName
  win_domain_group:
    name: LoadGen
    scope: global
    path: "OU=Groups,OU=GO,{{ domain_path }}"

- name: Create RDGateway Group
  win_domain_group:
    name: RD Gateway Users
    scope: global
    path: "OU=Groups,OU=GO,{{ domain_path }}"

- name: Create Service accounts - SQL Server
  win_domain_user:
    name: sql_svc
    password: "{{ sql_svc }}"
    password_never_expires: false
    state: present
    path: "OU=ServiceAccounts,OU=GO,{{ domain_path }}"
    description: SQL Server - Service Account

- name: Create Service accounts
  win_domain_user:
    name: sql_agt
    password: "{{ sql_agt }}"
    password_never_expires: false
    state: present
    path: "OU=ServiceAccounts,OU=GO,{{ domain_path }}"
    description: SQL Agent - Service Account

- name: Create Service accounts - SQL Agent
  win_domain_user:
    name: ansible
    password: "{{ ansible }}"
    password_never_expires: false
    state: present
    path: "OU=ServiceAccounts,OU=GO,{{ domain_path }}"
    groups:
      - Domain Admins

- name: Create Service accounts
  win_domain_user:
    name: loadgen_bot
    password: "{{ loadgen_bot }}"
    password_never_expires: false
    state: present
    path: "OU=ServiceAccounts,OU=GO,{{ domain_path }}"
    groups:
      - LoadGen

# All 100 accounts are created in a single PowerShell session instead of a
# win_domain_user loop: each loop iteration is a full WinRM round trip with a
# fresh PowerShell process and AD module import (~10s per account, 15+ minutes
# total). One session doing the same work takes seconds.
- name: Create LoadGen accounts
  win_shell: |
    $ErrorActionPreference = 'Stop'
    Import-Module ActiveDirectory

    $ou = 'OU=LoadGen,OU=GO,{{ domain_path }}'
    $password = ConvertTo-SecureString -String '{{ loadgen | regex_replace("'", "''") }}' -AsPlainText -Force
    $names = 1..100 | ForEach-Object { 'LoadGen{0:d3}' -f $_ }

    $existing = @(Get-ADUser -SearchBase $ou -Filter * | Select-Object -ExpandProperty SamAccountName)
    $created = @($names | Where-Object { $existing -notcontains $_ })
    foreach ($name in $created) {
      New-ADUser -Name $name -SamAccountName $name `
        -UserPrincipalName ('{0}@{1}' -f $name.ToLower(), '{{ dns_domain_name | lower }}') `
        -Company LoadGen -Description 'LoadGen simulation account' `
        -Path $ou -AccountPassword $password `
        -CannotChangePassword $true -PasswordNeverExpires $false `
        -Enabled $true
    }

    $members = @(Get-ADGroupMember -Identity LoadGen | Select-Object -ExpandProperty SamAccountName)
    $missing = @($names | Where-Object { $members -notcontains $_ })
    if ($missing.Count -gt 0) {
      Add-ADGroupMember -Identity LoadGen -Members $missing
    }

    Write-Output "created=$($created.Count) grouped=$($missing.Count)"
  register: loadgen_accounts
  changed_when: "'created=0 grouped=0' not in loadgen_accounts.stdout"
